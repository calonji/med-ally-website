[build]
  publish = "dist"
  command = "npm run build"

# Default headers for production
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects
[[redirects]]
  from = "/clinical-workflow-intelligence"
  to = "/how-it-works"
  status = 301
  force = true

[[redirects]]
  from = "/clinical-workflow-intelligence/*"
  to = "/how-it-works"
  status = 301
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
